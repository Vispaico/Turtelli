# Turtelli 2.0 — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "turtelli-api"
    static_configs:
      - targets: ["api:3001"]
    metrics_path: "/metrics"

  - job_name: "turtelli-web"
    static_configs:
      - targets: ["web:3000"]
    metrics_path: "/metrics"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
